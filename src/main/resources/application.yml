server:
  # Caddy 뒤에서 X-Forwarded-Proto/Host로 원래 주소(https://도메인)를 안다. 앱 포트는 외부에 열지 않는다(Caddy가 헤더를 덮어씀).
  forward-headers-strategy: framework
  servlet:
    session:
      # 기본 30분이면 편집기를 열어 둔 사이 세션과 CSRF 토큰이 사라져 저장이 403이 된다. 관리자 한 명뿐인 블로그라 길게.
      timeout: 7d
spring:
  application:
    name: blog
  security:
    oauth2:
      client:
        registration:
          google:
            # 비밀값은 환경변수로만. 없어도 앱은 뜨고 로그인만 실패한다.
            client-id: ${GOOGLE_CLIENT_ID:unset}
            client-secret: ${GOOGLE_CLIENT_SECRET:unset}
            scope: openid,profile,email
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate

blog:
  api-token: ${BLOG_API_TOKEN:}
  base-url: ${BLOG_BASE_URL:http://localhost:8080}
  admin-email: ${BLOG_ADMIN_EMAIL:}
  image-dir: ${BLOG_IMAGE_DIR:data/images}
