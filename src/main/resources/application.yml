spring:
  application:
    name: blog
  security:
    oauth2:
      client:
        registration:
          google:
            # 비밀값은 환경변수로만. 없어도 앱은 뜨고 로그인만 실패한다.
            client-id: ${GOOGLE_CLIENT_ID:unset}
            client-secret: ${GOOGLE_CLIENT_SECRET:unset}
            scope: openid,profile,email
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate

blog:
  api-token: ${BLOG_API_TOKEN:}
  base-url: ${BLOG_BASE_URL:http://localhost:8080}
  admin-email: ${BLOG_ADMIN_EMAIL:}
  image-dir: ${BLOG_IMAGE_DIR:data/images}
