<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content, toc)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}">
  <title th:replace="${title}">saip</title>
  <th:block th:if="${note != null and description != null}">
    <meta name="description" th:content="${description}">
    <link rel="canonical" th:href="${canonical}">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="saip">
    <meta property="og:title" th:content="${note.title}">
    <meta property="og:description" th:content="${description}">
    <meta property="og:url" th:content="${canonical}">
  </th:block>
  <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
  <link rel="stylesheet" th:href="@{/css/site.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css" media="(prefers-color-scheme: light)"
        integrity="sha384-eFTL69TLRZTkNfYZOLM+G04821K1qZao/4QLJbet1pP4tcF+fdXq/9CdqAbWRl/L" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" media="(prefers-color-scheme: dark)"
        integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH" crossorigin="anonymous">
  <script th:src="@{/js/side.js}"></script>
</head>
<body>
<header class="topbar">
  <button class="menu" type="button" aria-label="주제 목록 접기·펴기" title="주제 목록 접기·펴기">☰</button>
  <a class="brand" th:href="@{/}">saip<span class="brand-dot">.</span><span class="brand-sub">learning notes</span></a>
  <form class="search" th:action="@{/search}" method="get" role="search">
    <input type="search" name="q" placeholder="노트 검색" aria-label="노트 검색" th:value="${q}">
  </form>
  <nav class="account" aria-label="계정">
    <a sec:authorize="!isAuthenticated()" th:href="@{/oauth2/authorization/google}">로그인</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">관리</a>
    <span sec:authorize="isAuthenticated()" class="who" th:text="${#authentication.principal.fullName}">이름</span>
    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
      <button type="submit" class="link">로그아웃</button>
    </form>
  </nav>
</header>
<div class="page">
  <nav class="side" aria-label="주제">
    <details th:each="cat : ${tree}" open>
      <summary class="cat" th:text="${cat.name}">배포</summary>
      <a th:each="n : ${cat.notes}" th:href="@{/notes/{slug}(slug=${n.slug})}" th:text="${n.title}"
         th:classappend="${note != null and note.slug == n.slug} ? 'on'">Docker</a>
    </details>
    <p class="empty" th:if="${tree != null and #lists.isEmpty(tree)}">아직 노트가 없습니다.</p>
  </nav>
  <main class="main" th:replace="${content}">본문</main>
  <aside class="toc" th:replace="${toc}"></aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"
        integrity="sha384-RH2xi4eIQ/gjtbs9fUXM68sLSi99C7ZWBRX1vDrVv6GQXRibxXLbwO2NGZB74MbU" crossorigin="anonymous"></script>
<script type="module" th:src="@{/js/site.js}"></script>
</body>
</html>
