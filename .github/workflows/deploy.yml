# main에 push하면 테스트 → 이미지 → 서버 반영. 앞 잡이 실패하면 뒤 잡은 건너뛴다.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치지 않게 하나씩. 진행 중인 배포는 끊지 않는다.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # 러너에 Docker가 있어서 Testcontainers가 그대로 돈다
      - run: ./gradlew test
      - run: python3 claude-skill/blog/blog.py selftest

  image:
    needs: test
    # 다른 브랜치에서 수동 실행하면 테스트만 하고 배포하지 않는다
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ghcr 이름은 소문자만 된다
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/saip" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # known_hosts로 진짜 우리 서버인지 확인한다(처음 보는 서버면 접속 거부)
      - name: SSH 준비
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      # 서버 .env의 APP_TAG를 이 커밋으로 바꿔 두면 수동 재시작도 같은 버전을 쓴다
      - name: 서버 반영
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          scp deploy/compose.yaml deploy/Caddyfile "$TARGET:saip/"
          ssh "$TARGET" "cd ~/saip && sed -i 's/^APP_TAG=.*/APP_TAG=${{ github.sha }}/' .env && docker compose pull app && docker compose up -d"
      - name: 상태 확인
        run: curl -fsS -o /dev/null --retry 10 --retry-delay 6 --retry-all-errors "https://${{ secrets.SSH_HOST }}/"
